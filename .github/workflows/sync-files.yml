name: Sync APK to Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files/**'

jobs:
  sync:
    name: Publish files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view files >/dev/null 2>&1; then
            echo "release 已存在"
          else
            gh release create files --title "files" --notes "安装包存放处，由管理页面自动同步"
          fi

      - name: Upload changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(files/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "files/ 为空，跳过"
            exit 0
          fi
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "== 上传 $name ($(du -h "$f" | cut -f1)) =="
            gh release upload files "$f" --clobber
          done
          echo "全部完成"
